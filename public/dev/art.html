<!doctype html>
<html><head><meta charset="utf-8"><title>MISPRINT — art harness</title>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;left:8px;top:8px;font:12px/1.35 ui-monospace,monospace;color:#fff;background:#000a;padding:6px 8px;white-space:pre;pointer-events:none}
  #x{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px;pointer-events:none;
     background:linear-gradient(#fff,#fff) center/2px 100% no-repeat,linear-gradient(#fff,#fff) center/100% 2px no-repeat;mix-blend-mode:difference}
</style></head>
<body><canvas id="game"></canvas><div id="hud"></div><div id="x"></div>
<script type="module">
// Standalone art harness — no server logic. Query params:
//   seed=7  theme=0..4  q=0|1|2 (quality)  players=6
//   cam=fp|top|orbit|char   pos=x,y,z  look=yaw,pitch  fov=95
//   char=<index> ang=<rad around the character, 0 = front> dist=3.2 still=1 (pin that character in place)
//   t=<seconds> freeze: fast-forwards the scripted scene to t, then holds that frame (deterministic stills)
//   w=0..3 lock the viewmodel weapon   vm=idle|fire|reload   vmu=0..1 (reload progress at the freeze frame)
//   fx=explosion,death,impact,rings,tracers,flash-damage,flash-heal,flash-overprint,flash-rewind,flash-kill,speed
//        (forced a moment before the freeze frame, in front of the camera)   quiet=1 disables the ambient fx script
//   test=rebuild|perf   hud=0
import { createRenderer } from '/js/render/index.js';
import { generateMap } from '/shared/mapgen.js';
import { THEMES, INKS, FACES, F, PLAYER } from '/shared/constants.js';
import { WEAPONS } from '/shared/weapons.js';

const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? Number(Q.get(k)) : d);
const list = (k, d) => (Q.has(k) ? Q.get(k).split(',').map(Number) : d);
const seed = num('seed', 7);
const camMode = Q.get('cam') || 'fp';
const freeze = Q.has('t') ? num('t', 0) : null;
const forced = (Q.get('fx') || '').split(',').filter(Boolean);
const quiet = Q.has('quiet');
const hud = document.getElementById('hud');
if (Q.get('hud') === '0') { hud.style.display = 'none'; }
if (camMode !== 'fp' || Q.get('hud') === '0') document.getElementById('x').style.display = 'none';

let s = seed * 9301 + 49297;
const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };

const R = await createRenderer({ canvas: document.getElementById('game') });
if (Q.has('q')) R.setOptions({ quality: num('q', 1) });
const map = generateMap(seed, 6);
if (Q.has('theme')) map.theme = num('theme', 0) % THEMES.length;
R.buildWorld(map);
R.resize(innerWidth, innerHeight);
addEventListener('resize', () => R.resize(innerWidth, innerHeight));

// ---------- tiny world queries for the script ----------
function raycast(o, d, max = 200) {
  let best = max, n = null;
  for (const b of map.boxes) {
    let t0 = 0, t1 = best, axis = -1, sign = 0;
    let ok = true;
    for (let a = 0; a < 3 && ok; a++) {
      if (Math.abs(d[a]) < 1e-8) { if (o[a] < b.min[a] || o[a] > b.max[a]) ok = false; continue; }
      let ta = (b.min[a] - o[a]) / d[a], tb = (b.max[a] - o[a]) / d[a], sg = -1;
      if (ta > tb) { const x = ta; ta = tb; tb = x; sg = 1; }
      if (ta > t0) { t0 = ta; axis = a; sign = sg; }
      if (tb < t1) t1 = tb;
      if (t0 > t1) ok = false;
    }
    if (ok && axis >= 0 && t0 < best) { best = t0; n = [0, 0, 0]; n[axis] = sign; }
  }
  return n ? { t: best, p: [o[0] + d[0] * best, o[1] + d[1] * best, o[2] + d[2] * best], n } : null;
}
const dirOf = (yaw, pitch) => [-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch)];
function freeSpot(r0, r1) {
  for (let i = 0; i < 200; i++) {
    const a = rnd() * 6.283, r = r0 + rnd() * (r1 - r0);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (!map.boxes.some((b) => b.kind !== 'floor' && x > b.min[0] - 1.2 && x < b.max[0] + 1.2 && z > b.min[2] - 1.2 && z < b.max[2] + 1.2 && b.min[1] < 2)) return [x, 0, z];
  }
  return [0, 1, 6];
}

// ---------- camera ----------
const spawn = map.spawns[0];
const fpPos = list('pos', [spawn.pos[0] * 0.55, PLAYER.eye, spawn.pos[2] * 0.55]);
const fpLook = list('look', [Math.atan2(fpPos[0], fpPos[2]), -0.04]);
R.camera.fov = num('fov', 95);

// ---------- mock players ----------
const NAMES = ['RISO', 'TONER', 'GUTTER', 'BLEED', 'WATERMARK', 'HEADLINE', 'SMOL', 'SNOOZE'];
const nPlayers = Math.min(8, num('players', 8));
const players = [];
const front = dirOf(fpLook[0], 0);
const right = [-front[2], 0, front[0]];
const stage = (f, r) => [fpPos[0] + front[0] * f + right[0] * r, 0, fpPos[2] + front[2] * f + right[2] * r];
for (let i = 0; i < nPlayers; i++) {
  const info = { name: NAMES[i], color: i % INKS.length, face: i % FACES.length, isBot: i > 3 };
  R.addPlayer(i, info);
  players.push({ id: i, info, pos: [0, 0, 0], vel: [0, 0, 0], yaw: 0, pitch: 0, flags: F.GROUND, weapon: i % 4, alive: true, scale: 1, headScale: 1, ghost: false, hpFrac: 1 - i * 0.11, home: stage(6 + (i % 4) * 3.2, (i - 3.5) * 2.3) });
}
const followIdx = num('char', 0);
const still = Q.has('still');
const charAng = num('ang', 0), charDist = num('dist', 3.2);

// each behaviour writes pos/vel/yaw/flags for time t
const BEHAVE = [
  (p, t) => {            // run a circle
    const a = t * 0.9, r = 4.5;
    p.pos = [p.home[0] + Math.cos(a) * r, 0, p.home[2] + Math.sin(a) * r];
    p.vel = [-Math.sin(a) * r * 0.9 * 1.8, 0, Math.cos(a) * r * 0.9 * 1.8];
    p.yaw = Math.atan2(-p.vel[0], -p.vel[2]); p.flags = F.GROUND; p.pitch = 0.1 * Math.sin(t);
  },
  (p, t) => {            // crouch-walk back and forth
    const x = Math.sin(t * 0.8) * 2.5;
    p.pos = [p.home[0] + x, 0, p.home[2]]; p.vel = [Math.cos(t * 0.8) * 2.0, 0, 0];
    p.yaw = Math.atan2(-fpPos[0] + p.pos[0], -fpPos[2] + p.pos[2]) + Math.PI; p.flags = F.GROUND | F.CROUCH; p.pitch = 0.15;
  },
  (p, t) => {            // slide loops
    const u = (t * 0.6) % 1, x = -4 + u * 8;
    p.pos = [p.home[0] + x, 0, p.home[2]]; p.vel = [11 - u * 5, 0, 0];
    p.yaw = -Math.PI / 2; p.flags = F.GROUND | F.CROUCH | F.SLIDE; p.pitch = 0;
  },
  (p, t) => {            // wall-run on the nearest big wall-ish box (or just lean in the open)
    const u = (t * 0.5) % 1, x = -4 + u * 8;
    p.pos = [p.home[0] + x, 1.3 + Math.sin(u * 3.14) * 0.5, p.home[2]]; p.vel = [10.5, 0, 0];
    p.yaw = -Math.PI / 2; p.flags = F.WALL_L; p.pitch = 0.1;
  },
  (p, t) => {            // ghost (Watermark card) strolling
    const a = t * 0.5;
    p.pos = [p.home[0] + Math.cos(a) * 1.5, 0, p.home[2] + Math.sin(a) * 1.5];
    p.vel = [-Math.sin(a) * 2, 0, Math.cos(a) * 2]; p.yaw = Math.atan2(-p.vel[0], -p.vel[2]); p.flags = F.GROUND | F.GHOST; p.ghost = true;
  },
  (p, t) => {            // big head + big body, bunny hopping
    const u = (t * 1.1) % 1, y = Math.max(0, 4 * 1.6 * u * (1 - u));
    p.pos = [p.home[0], y, p.home[2]]; p.vel = [0, 8 * (0.5 - u), 0];
    p.yaw = Math.atan2(p.pos[0] - fpPos[0], p.pos[2] - fpPos[2]) + 0.3 * Math.sin(t); p.flags = y > 0.02 ? 0 : F.GROUND;
    p.scale = 1.25; p.headScale = 1.8; p.pitch = 0.3 * Math.sin(t * 2);
  },
  (p, t) => {            // tiny, dashes around and fires
    const u = (t * 0.7) % 1, dash = u < 0.12;
    const a = Math.floor(t * 0.7) * 2.4;
    p.pos = [p.home[0] + Math.cos(a) * 2 * u * 3, 0, p.home[2] + Math.sin(a) * 2 * u * 3];
    p.vel = dash ? [Math.cos(a) * 26, 0, Math.sin(a) * 26] : [Math.cos(a) * 6, 0, Math.sin(a) * 6];
    p.yaw = Math.atan2(-p.vel[0], -p.vel[2]); p.flags = F.GROUND | (dash ? F.DASH : 0); p.scale = 0.7;
  },
  (p, t) => {            // idle: reloads, emotes, looks around
    p.pos = [p.home[0], 0, p.home[2]]; p.vel = [0, 0, 0];
    p.yaw = Math.atan2(p.pos[0] - fpPos[0], p.pos[2] - fpPos[2]) + 0.4 * Math.sin(t * 0.6);
    p.flags = F.GROUND | ((t % 6) < 2 ? F.RELOAD : 0) | ((t % 6) > 4 ? F.CHARGE : 0); p.pitch = 0.5 * Math.sin(t * 0.9);
  },
];

// ---------- pickups ----------
const pickupState = map.pickups.map((p) => ({ id: p.id, type: p.type, pos: p.pos, active: true }));
// two extra right in front of the default camera so they show up in stills
pickupState.push({ id: 900, type: 'health', pos: [stage(5, -2.2)[0], 0.9, stage(5, -2.2)[2]], active: true });
pickupState.push({ id: 901, type: 'health', pos: [stage(5, 2.2)[0], 0.9, stage(5, 2.2)[2]], active: false });
pickupState.push({ id: 902, type: 'overprint', pos: [stage(7.5, 0)[0], 1.7, stage(7.5, 0)[2]], active: true });
R.setPickups(pickupState);

// ---------- scripted scene ----------
const lockW = Q.has('w') ? num('w', 0) : null;
const vmMode = Q.get('vm') || (lockW != null ? 'idle' : 'cycle');
const view = { yaw: fpLook[0], pitch: fpLook[1], prevYaw: fpLook[0], prevPitch: fpLook[1], weapon: lockW ?? 0, nextFire: 0.5, shots: 0, reloadAt: -1, charge: 0 };
R.view.setInk(0);
if (lockW != null) R.view.setWeapon(lockW);
const timers = { impact: 0.2, boom: 2.2, death: 3.6, ring: 0.6, flash: 4.5, pk: 3, proj: 1.2, emote: 2 };
const RINGS = ['dash', 'rewind', 'jumppad', 'pickup', 'spawn', 'land'];
const FLASHES = ['damage', 'heal', 'overprint', 'rewind', 'kill'];
let ringI = 0, flashI = 0, projId = 0;
const projs = [];

function eye() { const c = R.camera.position; return [c.x, c.y, c.z]; }
function shootFrom(o, d, color, weapon) {
  const hit = raycast(o, d, 120);
  const end = hit ? hit.p : [o[0] + d[0] * 60, o[1] + d[1] * 60, o[2] + d[2] * 60];
  R.fx.tracer(o, end, color, weapon);
  if (hit) R.fx.impact(hit.p, hit.n, color, weapon);
}
function fireView(time) {
  const w = view.weapon, def = WEAPONS[w];
  const charge = w === 2 ? 1 : 1;
  R.view.fire(w, charge);
  const o = R.muzzleWorldPos();
  for (let k = 0; k < def.pellets; k++) {
    const sp = def.spread + 0.004;
    const d = dirOf(view.yaw + (rnd() - 0.5) * 2 * sp, view.pitch + (rnd() - 0.5) * 2 * sp);
    if (def.kind === 'projectile') {
      const pid = ++projId;
      R.projectile.spawn(pid, 0);
      projs.push({ pid, p: eye(), v: d.map((x) => x * def.speed), born: time, color: 0 });
    } else {
      const hit = raycast(eye(), d, def.range);
      const end = hit ? hit.p : eye().map((x, i) => x + d[i] * 60);
      R.fx.tracer(o, end, 0, w);
      if (hit) R.fx.impact(hit.p, hit.n, 0, w);
    }
  }
}

function script(dt, time) {
  // players
  for (const p of players) {
    p.ghost = false; p.scale = 1; p.headScale = 1;
    BEHAVE[p.id % BEHAVE.length](p, time + p.id * 1.7);
    if (still && p.id === followIdx) { p.pos = [p.home[0], p.pos[1] > 0.6 ? p.pos[1] : 0, p.home[2]]; p.yaw = Math.PI; if (p.flags & F.WALL_L) p.pos[1] = 0; }
    R.updatePlayer(p.id, p);
  }
  if (!quiet) {
    if ((timers.emote -= dt) < 0) { timers.emote = 2.5; R.playerEvent(7 % nPlayers, 'emote'); R.playerEvent(1, 'hurt'); R.playerEvent(6 % nPlayers, 'fire'); }
    // ambient gunfire painting the arena
    if ((timers.impact -= dt) < 0) {
      timers.impact = 0.11;
      const p = players[(rnd() * nPlayers) | 0];
      const o = [p.pos[0], p.pos[1] + 1.3, p.pos[2]];
      const d = dirOf(rnd() * 6.283, (rnd() - 0.6) * 0.5);
      shootFrom(o, d, p.info.color, (rnd() * 3) | 0);
      if (rnd() < 0.3) { R.playerEvent(p.id, 'fire'); const q = players[(rnd() * nPlayers) | 0]; R.fx.hitPlayer([q.pos[0], q.pos[1] + 1.2, q.pos[2]], p.info.color, rnd() < 0.3); }
    }
    if ((timers.boom -= dt) < 0) { timers.boom = 4.2; const c = stage(7 + rnd() * 8, (rnd() - 0.5) * 10); R.fx.explosion([c[0], 0.5, c[2]], 4.6, (rnd() * 10) | 0); }
    if ((timers.death -= dt) < 0) { timers.death = 5.3; const c = stage(5 + rnd() * 8, (rnd() - 0.5) * 8); R.fx.death(c, (rnd() * 10) | 0, (rnd() * 10) | 0); }
    if ((timers.ring -= dt) < 0) { timers.ring = 0.7; const c = stage(4 + rnd() * 6, (rnd() - 0.5) * 8); R.fx.ring(c, (rnd() * 10) | 0, RINGS[ringI++ % RINGS.length]); }
    if (Q.has('flashes') && (timers.flash -= dt) < 0) { timers.flash = 2; R.fx.flash(FLASHES[flashI++ % FLASHES.length]); }
    if ((timers.pk -= dt) < 0) { timers.pk = 3; const blink = pickupState.find((p) => p.id === 901); blink.active = !blink.active; R.setPickups(pickupState); }
    if ((timers.proj -= dt) < 0) {
      timers.proj = 2.6;
      const p = players[0], pid = ++projId;
      R.projectile.spawn(pid, p.info.color);
      projs.push({ pid, p: [p.pos[0], 1.4, p.pos[2]], v: [front[0] * -6 + right[0] * 8, 9, front[2] * -6 + right[2] * 8], born: time, color: p.info.color });
    }
  }
  // blotter bombs
  for (let i = projs.length - 1; i >= 0; i--) {
    const b = projs[i];
    b.v[1] -= 15 * dt;
    for (let a = 0; a < 3; a++) b.p[a] += b.v[a] * dt;
    if (b.p[1] < 0.22) { b.p[1] = 0.22; b.v[1] = Math.abs(b.v[1]) * 0.5; b.bounced = (b.bounced || 0) + 1; }
    R.projectile.move(b.pid, b.p);
    if (time - b.born > 1.7 || b.bounced > 1) { R.projectile.remove(b.pid); R.fx.explosion(b.p, 4.6, b.color); projs.splice(i, 1); }
  }
  // camera
  const cam = R.camera;
  if (camMode === 'top') { cam.position.set(0, map.size * 0.95, map.size * 0.45); cam.rotation.set(-1.12, 0, 0); cam.fov = 70; }
  else if (camMode === 'orbit') { const a = time * 0.25; cam.position.set(Math.sin(a) * 30, 15, Math.cos(a) * 30); cam.rotation.set(-0.42, a, 0); cam.fov = 75; }
  else if (camMode === 'char') {
    const p = players[followIdx % nPlayers], a = p.yaw + Math.PI + charAng;
    const h = (1.15 + num('h', 0)) * (p.scale || 1);
    cam.position.set(p.pos[0] + Math.sin(a) * charDist, p.pos[1] + h + 0.25, p.pos[2] + Math.cos(a) * charDist);
    cam.rotation.set(-0.08, a, 0); cam.fov = num('fov', 55);
  } else {
    view.yaw = fpLook[0] + (freeze == null && !Q.has('pos') ? Math.sin(time * 0.25) * 0.5 : 0);
    view.pitch = fpLook[1];
    cam.position.set(fpPos[0], fpPos[1], fpPos[2]); cam.rotation.set(view.pitch, view.yaw, 0);
  }
  // viewmodel
  const fp = camMode === 'fp';
  R.view.setVisible(fp);
  const speed = Q.has('speed') ? num('speed', 20) : forced.includes('speed') ? 24 : 6 + 2 * Math.sin(time);
  R.setView({
    dt, speed, vel: [speed, 0, 0], onGround: true, sliding: Q.has('slide'), dashing: forced.includes('speed'), wallSide: num('wall', 0),
    lookDelta: [view.yaw - view.prevYaw, view.pitch - view.prevPitch], hpFrac: num('hp', 1), overprint: Q.has('overprint'), rewind: 0, alive: true,
  });
  view.prevYaw = view.yaw; view.prevPitch = view.pitch;
  if (fp && vmMode === 'cycle') {
    const def = WEAPONS[view.weapon];
    if (view.reloadAt >= 0) {
      if (time > view.reloadAt + def.reload + 0.4) { view.reloadAt = -1; view.shots = 0; view.weapon = (view.weapon + 1) % 4; R.view.setWeapon(view.weapon); view.nextFire = time + 0.7; }
    } else if (time >= view.nextFire) {
      if (view.weapon === 2 && view.charge < 1) { view.charge = Math.min(1, view.charge + dt / 0.95); R.view.setCharge(view.charge); }
      else {
        fireView(time); view.charge = 0; R.view.setCharge(0);
        view.shots++;
        view.nextFire = time + 60 / def.rpm;
        if (view.shots >= Math.min(def.mag, 8)) { view.reloadAt = time + 0.35; setTimeoutSim(0.35, () => R.view.reload(view.weapon, def.reload)); }
      }
    }
  }
  runSimTimers(time);
}
// sim-time timers (so fast-forward stays deterministic)
const simTimers = [];
let simNow = 0;
function setTimeoutSim(delay, fn) { simTimers.push({ at: simNow + delay, fn }); }
function runSimTimers(time) { simNow = time; for (let i = simTimers.length - 1; i >= 0; i--) if (simTimers[i].at <= time) { simTimers[i].fn(); simTimers.splice(i, 1); } }

// events forced shortly before the freeze frame so stills catch them mid-flight
function scheduleForced(t) {
  const at = (lead, fn) => simTimers.push({ at: Math.max(0, t - lead), fn });
  const ahead = (d, r = 0, y = 0) => { const c = stage(d, r); return [c[0], y, c[2]]; };
  for (const f of forced) {
    if (f === 'explosion') at(num('lead', 0.12), () => R.fx.explosion(ahead(7, 0, 0.6), 4.6, 4));
    if (f === 'death') at(num('lead', 0.06), () => R.fx.death(ahead(5.5, 0.5, 0), 1, 2));
    if (f === 'rings') RINGS.forEach((k, i) => at(0.12, () => R.fx.ring(ahead(5, (i - 2.5) * 2.2, 0), i + 2, k)));
    if (f === 'tracers') at(0.05, () => { for (let w = 0; w < 3; w++) for (let k = 0; k < (w === 1 ? 9 : 1); k++) shootFrom(ahead(1.5, -1 + w, 1.4), dirOf(view.yaw + (w - 1) * 0.12 + (rnd() - 0.5) * 0.1, 0.02 + (rnd() - 0.5) * 0.08), w + 3, w); });
    if (f === 'impact') at(1.2, () => { for (let k = 0; k < 90; k++) { const d = dirOf(view.yaw + (rnd() - 0.5) * 0.9, view.pitch + (rnd() - 0.45) * 0.6); const h = raycast(fpPos, d, 100); if (h) R.fx.impact(h.p, h.n, (rnd() * 10) | 0, (rnd() * 3) | 0); } });
    if (f === 'hit') at(0.08, () => { R.fx.hitPlayer(ahead(4, -0.8, 1.3), 2, false); R.fx.hitPlayer(ahead(4, 0.8, 1.5), 5, true); });
    if (f.startsWith('flash-')) at(num('lead', 0.1), () => R.fx.flash(f.slice(6)));
    if (f === 'shake') at(0.05, () => R.fx.shake(1));
  }
  if (lockW != null && vmMode === 'fire') at(num('lead', 0.035), () => fireView(t));
  if (lockW != null && vmMode === 'reload') at(WEAPONS[lockW].reload * num('vmu', 0.5), () => R.view.reload(lockW, WEAPONS[lockW].reload));
  if (lockW === 2 && Q.has('charge')) at(1, () => R.view.setCharge(num('charge', 1)));
}

// ---------- tests ----------
async function runTests() {
  const test = Q.get('test');
  if (test === 'rebuild') {
    const mem = () => ({ ...R.renderer.info.memory, programs: R.renderer.info.programs.length });
    R.render(0.016, 1);
    const before = mem();
    for (let i = 0; i < 10; i++) {
      const m = generateMap(seed + i + 1, 6);
      R.buildWorld(m);
      for (let k = 0; k < 40; k++) R.fx.impact([rnd() * 20 - 10, 0, rnd() * 20 - 10], [0, 1, 0], k % 10, 0);
      R.render(0.016, 1 + i * 0.1);
    }
    console.log('REBUILD_TEST before', JSON.stringify(before), 'after', JSON.stringify(mem()));
  }
  if (test === 'perf') {
    for (const q of [0, 1, 2]) {
      R.setOptions({ quality: q });
      for (let k = 0; k < 3; k++) { script(0.016, 5 + k * 0.016); R.render(0.016, 5 + k * 0.016); }
      console.log('PERF_TEST quality', q, JSON.stringify(R.stats()), 'drawingBuffer', R.renderer.domElement.width + 'x' + R.renderer.domElement.height);
    }
  }
}

// ---------- main loop ----------
if (freeze != null) {
  scheduleForced(freeze);
  const step = 1 / 60;
  let t = 0;
  while (t < freeze - 1e-6) { const dt = Math.min(step, freeze - t); t += dt; script(dt, t); R.advance(dt, t); }
  R.render(0, freeze);
}
await runTests();
let last = performance.now(), time = freeze ?? 0, frames = 0, fpsT = 0, fps = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (freeze == null) { time += dt; script(dt, time); R.render(dt, time); }
  else R.render(0, freeze);
  frames++; fpsT += dt;
  if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  const st = R.stats();
  hud.textContent = `${map.name} · ${THEMES[map.theme].name} · seed ${seed}\n${fps.toFixed(0)} fps · ${st.calls} calls · ${st.triangles} tris · ${st.decals} decals\ngeo ${st.geometries} tex ${st.textures} prog ${st.programs}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__art = { R, map, players, script };
console.log('ART_READY', map.name, THEMES[map.theme].name, JSON.stringify(R.stats()));
</script></body></html>
